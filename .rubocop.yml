plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "upstream/**/*"
    - "vendor/**/*"
    - "gemfiles/**/*"

Naming/FileName:
  Exclude:
    - "lib/wavebird-rails.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: true

Layout/LineLength:
  Max: 120

# types.rb deliberately mirrors upstream's single public_contracts file and
# grows with the API contract.
Metrics/ModuleLength:
  Exclude:
    - "lib/wavebird/types.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 12

# Spec files may cover several small sibling classes (e.g. the error hierarchy).
RSpec/SpecFilePathFormat:
  Enabled: false

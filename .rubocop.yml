plugins:
  - rubocop-rake
  - rubocop-rspec

# AllCops/Exclude is replaced, not merged, on inherit -- declaring it here once
# dropped RuboCop's own defaults (node_modules, tmp, vendor, .git), which is how
# the gitignored tmp/chatdemo scratch app started failing the default rake task
# and stopping it before yard_coverage ever ran. Merging keeps those defaults, so
# the list below only has to name what is specific to this repo.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - "upstream/**/*"
    - "gemfiles/**/*"

Naming/FileName:
  Exclude:
    - "lib/wavebird-rails.rb"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: true

Layout/LineLength:
  Max: 120

# types.rb deliberately mirrors upstream's single public_contracts file and
# grows with the API contract; decision_normalizer.rb is a single cohesive port
# of upstream's normalizeV1Decision.
Metrics/ModuleLength:
  Exclude:
    - "lib/wavebird/types.rb"
    - "lib/wavebird/decision_normalizer.rb"

# Client is one class per upstream WavebirdClient, covering all nine canonical
# v1 endpoints; splitting it would diverge from the SDK it ports.
Metrics/ClassLength:
  Exclude:
    - "lib/wavebird/client.rb"

# Endpoint methods take the request contract as keyword arguments, mirroring
# the upstream option objects — the count tracks the API, not complexity.
Metrics/ParameterLists:
  CountKeywordArgs: false

# The request/response contract checks port upstream's validation branch for
# branch; collapsing them would hide which rule rejected a payload.
Metrics/AbcSize:
  Exclude:
    - "lib/wavebird/client.rb"
    - "lib/wavebird/decision_normalizer.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/wavebird/client.rb"
    - "lib/wavebird/decision_normalizer.rb"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/wavebird/client.rb"
    - "lib/wavebird/decision_normalizer.rb"

Metrics/MethodLength:
  Max: 13

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

RSpec/MultipleExpectations:
  Max: 5

# The shared client context already provides three (config, client, api_base)
# before a spec defines its own fixtures.
RSpec/MultipleMemoizedHelpers:
  Max: 6

# Endpoint specs stub a full request/response contract before acting on it.
RSpec/ExampleLength:
  Max: 13

# Spec files may cover several small sibling classes (e.g. the error hierarchy).
RSpec/SpecFilePathFormat:
  Enabled: false

# Client specs are split by endpoint group ("decisions", "request plumbing")
# rather than by single method, so the second describe argument is a topic.
RSpec/DescribeMethod:
  Enabled: false

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ruby × Rails matrix. The gemspec promises Ruby >= 3.2 and railties >= 7.1,
  # < 9, so both axes are tested rather than assumed — a bare `ruby` matrix
  # resolves the newest Rails on every Ruby, which is a combination no consumer
  # on an older Ruby would ever get (and, for Rails 8.1 on Ruby 3.3, one that
  # does not even parse).
  test:
    runs-on: ubuntu-latest
    name: rails ${{ matrix.rails }} / ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        rails: ["7.1", "7.2", "8.0", "8.1"]
        exclude:
          # Rails 8.1 requires Ruby 3.4 (decision #007): actionview 8.1 fails to
          # parse on 3.3, and 8.1 declares required_ruby_version >= 3.2.0 only
          # nominally — 3.4 is the supported floor in practice.
          - { rails: "8.1", ruby: "3.2" }
          - { rails: "8.1", ruby: "3.3" }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  # Capybara system specs: a real spec/dummy host app driven through headless
  # Chrome. Split from `test` because it needs a browser and runs as its own
  # process (only one Rails application can exist per process).
  system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # ubuntu-latest ships Chrome and a matching chromedriver; pin the driver so
      # Selenium does not pick a mismatched one off PATH.
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - run: bundle exec rake spec:system
        env:
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake rubocop
